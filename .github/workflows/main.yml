
name: Build Falavarjan Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'falavarjan-android-project.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q falavarjan-android-project.zip
          test -f falavarjan-android/settings.gradle
          test -f falavarjan-android/app/build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p falavarjan-android assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: falavarjan-android-apk
          path: falavarjan-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
